[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-content-agent"
version = "0.1.0"
description = "Weekday mathematics Facebook draft agent with mandatory human review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.52,<2",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
